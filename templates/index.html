<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Editorial con IA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1, h2, h3, h4 { color: #333; margin-top: 0; }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin: 4px;
            color: #333;
        }
        .filter-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        .filter-btn:hover { border-color: #007bff; }
        .trending-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 12px;
            color: white;
        }
        .trending-section h3 { color: white; }
        .trending-item {
            padding: 15px;
            margin: 10px 0;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            cursor: pointer;
        }
        .trending-item:hover { background: rgba(255,255,255,0.25); }
        .trending-topic { font-weight: 600; font-size: 16px; }
        .trending-source { font-size: 12px; opacity: 0.8; margin-top: 5px; }
        input[type="text"], select {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }
        input[type="text"] { flex: 1; min-width: 200px; }
        .input-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        button {
            background: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        .tag {
            display: inline-block;
            background: #e9ecef;
            padding: 6px 12px;
            margin: 4px;
            border-radius: 4px;
            font-size: 14px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
        .score-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-right: 10px;
        }
        .score-low { background: #ffebee; color: #c62828; }
        .score-medium { background: #fff8e1; color: #f57f17; }
        .score-high { background: #e8f5e9; color: #2e7d32; }
        .score-critical { background: #b71c1c; color: white; }
        .history-item {
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .history-topic { font-weight: 600; font-size: 16px; }
        .history-meta { font-size: 12px; color: #666; margin-top: 5px; }
        .history-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-small {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            color: white;
        }
        .btn-analyze { background: #007bff; }
        .btn-delete { background: #dc3545; }
        .news-section {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 25px;
            border-radius: 12px;
            color: white;
            margin-top: 20px;
        }
        .news-section h4 { color: white; margin: 0 0 15px 0; }
        .news-item {
            padding: 12px;
            margin: 8px 0;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
        }
        .news-title { font-weight: 600; margin-bottom: 5px; }
        .news-title a { color: white; text-decoration: none; }
        .news-title a:hover { text-decoration: underline; }
        .news-meta { font-size: 12px; opacity: 0.9; }
        .evolution-section {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 25px;
            border-radius: 12px;
            color: white;
            margin-top: 20px;
        }
        .evolution-section h4 { color: white; margin: 0 0 15px 0; }
        .trend-indicator {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.25);
        }
        .chart-container {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #e0e0e0;
            background: white;
            border-radius: 12px;
        }
        .footer a { color: #007bff; text-decoration: none; font-weight: 600; }
        .footer .version { font-size: 12px; color: #999; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 Radar Editorial con IA</h1>
        <h3>📂 Categorías</h3>
        <div id="categoryFilters"></div>
    </div>
    
    <div class="container">
        <div class="trending-section">
            <h3>🔥 Tendencias en Chile</h3>
            <div id="trendingList"><p>Cargando...</p></div>
        </div>
    </div>
    
    <div class="container">
        <h3>🔍 Análisis Personalizado</h3>
        <div class="input-group">
            <input type="text" id="topicInput" placeholder="Ej: Endeudamiento de jóvenes en Chile">
            <select id="categorySelect"><option value="">Categoría</option></select>
            <select id="regionSelect"><option value="Chile">Chile</option></select>
        </div>
        <button onclick="analyzeTrend()" id="analyzeBtn">Analizar Tendencia</button>
        <div class="loading" id="loading"><p>🤖 Analizando y buscando datos históricos...</p></div>
        <div class="error" id="error"></div>
        <div class="result" id="result">
            <h3> Análisis: <span id="resultTopic"></span></h3>
            <div id="analysisContent"></div>
        </div>
    </div>
    
    <div class="container">
        <h2>📚 Historial de Análisis</h2>
        <div id="historyList"><p>Cargando...</p></div>
    </div>
    
    <div class="footer">
        <div>Desarrollado por <a href="https://ltv.cl" target="_blank">Joesramirez</a> - <a href="https://ltv.cl" target="_blank">LTV.cl</a></div>
        <div class="version">Versión 3.0.0 | Última actualización: Septiembre 2026</div>
    </div>

    <script>
        let currentCategory = 'all';
        let categories = [];
        let evolutionChart = null;

        async function loadFilters() {
            try {
                const catRes = await fetch('/api/categories');
                categories = await catRes.json();
                renderFilters();
                loadTrending();
                loadHistory();
            } catch (err) {
                console.error('Error cargando filtros:', err);
            }
        }

        function renderFilters() {
            const catContainer = document.getElementById('categoryFilters');
            let html = '<button class="filter-btn active" onclick="selectCategory(\'all\')">Todas</button>';
            categories.forEach(function(cat) {
                html += '<button class="filter-btn" onclick="selectCategory(\'' + cat.name + '\')">' + cat.icon + ' ' + cat.name + '</button>';
            });
            catContainer.innerHTML = html;
            
            const catSelect = document.getElementById('categorySelect');
            catSelect.innerHTML = '<option value="">Categoría</option>';
            categories.forEach(function(cat) {
                catSelect.innerHTML += '<option value="' + cat.name + '">' + cat.icon + ' ' + cat.name + '</option>';
            });
        }

        function selectCategory(cat) {
            currentCategory = cat;
            const buttons = document.querySelectorAll('#categoryFilters .filter-btn');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
                if ((cat === 'all' && btn.textContent.trim() === 'Todas') || btn.textContent.includes(cat)) {
                    btn.classList.add('active');
                }
            });
            loadTrending();
        }

        async function loadTrending() {
            const list = document.getElementById('trendingList');
            list.innerHTML = '<p>Cargando...</p>';
            try {
                const url = '/api/trending?category=' + encodeURIComponent(currentCategory) + '&limit=5';
                const res = await fetch(url);
                const trends = await res.json();
                if (trends.length === 0) {
                    list.innerHTML = '<p>No hay tendencias.</p>';
                    return;
                }
                let html = '';
                trends.forEach(function(t, i) {
                    html += '<div class="trending-item" onclick="useTrend(\'' + t.topic.replace(/'/g, "\\'") + '\')">';
                    html += '<div class="trending-topic">' + (i + 1) + '. ' + t.topic + '</div>';
                    html += '<div class="trending-source">📊 ' + t.source + ' | ' + t.region + '</div>';
                    html += '</div>';
                });
                list.innerHTML = html;
            } catch (err) {
                list.innerHTML = '<p>Error cargando tendencias</p>';
            }
        }

        function useTrend(topic) {
            document.getElementById('topicInput').value = topic;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function analyzeTrend() {
            const topic = document.getElementById('topicInput').value.trim();
            const category = document.getElementById('categorySelect').value;
            const region = document.getElementById('regionSelect').value;
            if (!topic) { alert('Ingresa un tema'); return; }

            document.getElementById('analyzeBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic: topic, category: category, region: region })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                displayResult(data);
                document.getElementById('result').style.display = 'block';
                loadHistory();
            } catch (err) {
                document.getElementById('error').textContent = 'Error: ' + err.message;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        }

        function getScoreClass(score) {
            if (score >= 9) return 'score-critical';
            if (score >= 7) return 'score-high';
            if (score >= 4) return 'score-medium';
            return 'score-low';
        }

        function getScoreLabel(score) {
            if (score >= 9) return '🔴 CRÍTICA';
            if (score >= 7) return '✅ ALTA';
            if (score >= 4) return '⚠️ MEDIA';
            return '🔵 BAJA';
        }

        function renderEvolutionChart(evolution, topic) {
            if (evolutionChart) {
                evolutionChart.destroy();
            }
            
            const canvas = document.getElementById('evolutionChart');
            if (!canvas) return;
            
            const labels = evolution.map(function(e) { return e.semana; });
            const data = evolution.map(function(e) { return e.articulos; });
            
            const ctx = canvas.getContext('2d');
            evolutionChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Artículos sobre "' + topic + '"',
                        data: data,
                        borderColor: '#007bff',
                        backgroundColor: 'rgba(0, 123, 255, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#007bff',
                        pointRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: { color: '#333' }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#666' },
                            grid: { color: '#e0e0e0' }
                        },
                        x: {
                            ticks: { color: '#666' },
                            grid: { color: '#e0e0e0' }
                        }
                    }
                }
            });
        }

        function displayResult(data) {
            // FIX: Validaciones robustas para evitar errores
            document.getElementById('resultTopic').textContent = data.topic || 'Tema desconocido';
            
            const a = data.analysis || {};
            const score = data.score || (a.puntaje_relevancia) || 0;
            let html = '';
            
            // Puntaje de relevancia
            if (score > 0) {
                html += '<div style="margin-bottom: 20px;">';
                html += '<span class="score-badge ' + getScoreClass(score) + '">' + score + '/10 - ' + getScoreLabel(score) + '</span>';
                if (a.justificacion_puntaje) {
                    html += '<span style="color: #666; font-size: 14px; margin-left: 10px;">' + a.justificacion_puntaje + '</span>';
                }
                html += '</div>';
            }
            
            // Evolución temporal con gráfico
            if (data.evolution && Array.isArray(data.evolution) && data.evolution.length > 0) {
                html += '<div class="evolution-section">';
                html += '<h4>📈 Evolución del Interés (últimas 4 semanas)</h4>';
                
                const direction = data.trend_direction || 'estable';
                const percent = data.trend_percent || 0;
                let arrow = '➡️';
                let directionText = 'Estable';
                if (direction === 'subiendo') { arrow = '📈'; directionText = 'Subiendo +' + percent + '%'; }
                else if (direction === 'bajando') { arrow = '📉'; directionText = 'Bajando -' + percent + '%'; }
                
                html += '<div class="trend-indicator">' + arrow + ' Tendencia: ' + directionText + '</div>';
                html += '<div class="chart-container" style="height: 250px;">';
                html += '<canvas id="evolutionChart"></canvas>';
                html += '</div>';
                html += '</div>';
            }
            
            // Hipótesis
            if (a.hipotesis) {
                html += '<div style="background: #e3f2fd; padding: 15px; border-radius: 8px; border-left: 4px solid #2196f3; margin: 20px 0;">';
                html += '<h4 style="margin-top:0; color: #1565c0;">🎯 Hipótesis Editorial</h4>';
                html += '<p style="margin-bottom:0; line-height: 1.6;">' + a.hipotesis + '</p>';
                html += '</div>';
            }
            
            // Noticias reales
            if (a.noticias_reales && Array.isArray(a.noticias_reales) && a.noticias_reales.length > 0) {
                html += '<div class="news-section">';
                html += '<h4>📰 Noticias Reales Encontradas (' + a.noticias_reales.length + ')</h4>';
                a.noticias_reales.forEach(function(news) {
                    html += '<div class="news-item">';
                    if (news.url) {
                        html += '<div class="news-title"><a href="' + news.url + '" target="_blank"> ' + news.titulo + '</a></div>';
                    } else {
                        html += '<div class="news-title">' + news.titulo + '</div>';
                    }
                    html += '<div class="news-meta">';
                    if (news.fuente) html += '📡 ' + news.fuente;
                    if (news.fecha) html += ' | 📅 ' + news.fecha;
                    html += '</div></div>';
                });
                html += '</div>';
            }
            
            // Titulares
            if (a.titulares_ejemplo && Array.isArray(a.titulares_ejemplo) && a.titulares_ejemplo.length > 0) {
                html += '<h4>📝 Posibles Titulares</h4><ul>';
                a.titulares_ejemplo.forEach(function(t) { html += '<li>📌 ' + t + '</li>'; });
                html += '</ul>';
            }
            
            // Señales clave
            if (a.senales_clave && Array.isArray(a.senales_clave) && a.senales_clave.length > 0) {
                html += '<h4>🔍 Señales clave</h4><div>';
                a.senales_clave.forEach(function(s) { html += '<span class="tag">' + s + '</span>'; });
                html += '</div>';
            }
            
            // Ángulos
            if (a.angulos_periodisticos && Array.isArray(a.angulos_periodisticos) && a.angulos_periodisticos.length > 0) {
                html += '<h4>📝 Ángulos de investigación</h4><ul>';
                a.angulos_periodisticos.forEach(function(ang) { html += '<li>' + ang + '</li>'; });
                html += '</ul>';
            }
            
            // Fuentes
            if (a.fuentes_sugeridas && Array.isArray(a.fuentes_sugeridas) && a.fuentes_sugeridas.length > 0) {
                html += '<h4>📚 Fuentes sugeridas</h4><ul>';
                a.fuentes_sugeridas.forEach(function(f) { html += '<li>🔗 ' + f + '</li>'; });
                html += '</ul>';
            }
            
            // Si no hay nada que mostrar
            if (html === '') {
                html = '<p style="color: #666;">No se generó análisis. Intenta con otro tema.</p>';
            }
            
            document.getElementById('analysisContent').innerHTML = html;
            
            // Renderizar gráfico después de insertar HTML
            if (data.evolution && Array.isArray(data.evolution) && data.evolution.length > 0) {
                setTimeout(function() {
                    renderEvolutionChart(data.evolution, data.topic);
                }, 200);
            }
        }

        async function loadHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '<p>Cargando...</p>';
            try {
                const res = await fetch('/api/history?limit=20');
                const history = await res.json();
                if (history.length === 0) {
                    list.innerHTML = '<p style="color: #666;">Aún no hay análisis. ¡Haz tu primer análisis arriba!</p>';
                    return;
                }
                let html = '';
                history.forEach(function(item) {
                    const analysis = item.analysis || {};
                    const score = item.score || analysis.puntaje_relevancia || 0;
                    const category = item.category || 'General';
                    const date = item.created_at ? new Date(item.created_at).toLocaleString('es-CL') : '';
                    html += '<div class="history-item">';
                    html += '<div class="history-header">';
                    html += '<div><div class="history-topic">' + item.topic + '</div>';
                    html += '<div class="history-meta">📂 ' + category + ' | 📅 ' + date + '</div></div>';
                    if (score > 0) {
                        html += '<span class="score-badge ' + getScoreClass(score) + '">' + score + '/10</span>';
                    }
                    html += '</div>';
                    html += '<div class="history-actions">';
                    html += '<button class="btn-small btn-analyze" onclick="reAnalyze(\'' + item.topic.replace(/'/g, "\\'") + '\', \'' + (item.category || '') + '\')">🔄 Re-analizar</button>';
                    html += '<button class="btn-small btn-delete" onclick="deleteAnalysis(' + item.id + ')">🗑️ Eliminar</button>';
                    html += '</div></div>';
                });
                list.innerHTML = html;
            } catch (err) {
                console.error('Error:', err);
                list.innerHTML = '<p>Error cargando historial</p>';
            }
        }

        function reAnalyze(topic, category) {
            document.getElementById('topicInput').value = topic;
            if (category) document.getElementById('categorySelect').value = category;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(function() { analyzeTrend(); }, 500);
        }

        async function deleteAnalysis(id) {
            if (!confirm('¿Eliminar este análisis?')) return;
            try {
                const res = await fetch('/api/history/' + id, { method: 'DELETE' });
                if (res.ok) loadHistory();
            } catch (err) { alert('Error al eliminar'); }
        }

        loadFilters();
    </script>
</body>
</html>
