<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Radar Editorial con IA</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 { color: #333; margin-top: 0; }
        .filters {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .filter-group h3 {
            margin: 0 0 10px 0;
            color: #555;
            font-size: 14px;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            color: #333;
            font-weight: 500;
        }
        .filter-btn:hover {
            border-color: #007bff;
            background: #e7f3ff;
            color: #007bff;
        }
        .filter-btn.active {
            background: #007bff;
            color: white !important;
            border-color: #007bff;
        }
        .trending-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 12px;
            color: white;
        }
        .trending-section h3 {
            margin: 0 0 20px 0;
            color: white;
            font-size: 20px;
        }
        .trending-item {
            padding: 15px;
            margin: 10px 0;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .trending-item:hover {
            background: rgba(255,255,255,0.25);
            transform: translateX(5px);
        }
        .trending-topic {
            font-weight: 600;
            font-size: 16px;
        }
        .trending-source {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        input[type="text"], select {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }
        input[type="text"] {
            flex: 1;
            min-width: 200px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        .result h4 {
            color: #555;
            margin: 20px 0 10px 0;
        }
        .tag {
            display: inline-block;
            background: #e9ecef;
            padding: 6px 12px;
            margin: 4px 4px 4px 0;
            border-radius: 4px;
            font-size: 14px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
        @media (max-width: 768px) {
            .filters { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Radar Editorial con IA</h1>
        <div class="filters">
            <div class="filter-group">
                <h3>📂 Categorías</h3>
                <div class="filter-buttons" id="categoryFilters">
                    <button class="filter-btn active" onclick="selectCategory('all')">Todas</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="trending-section">
            <h3>🔥 Tendencias en Chile</h3>
            <div id="trendingList">
                <p>Cargando tendencias...</p>
            </div>
        </div>
    </div>
    
    <div class="container">
        <h3>🔍 Análisis Personalizado</h3>
        <div class="input-group">
            <input type="text" id="topicInput" placeholder="Ej: Endeudamiento de jóvenes en Chile">
            <select id="categorySelect">
                <option value="">Categoría</option>
            </select>
            <select id="regionSelect">
                <option value="Chile">Chile</option>
            </select>
        </div>
        <button onclick="analyzeTrend()" id="analyzeBtn">Analizar Tendencia</button>
        
        <div class="loading" id="loading">
            <p> La IA está analizando...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result" id="result">
            <h3>📊 Análisis: <span id="resultTopic"></span></h3>
            <div id="analysisContent"></div>
        </div>
    </div>

    <script>
        let currentCategory = 'all';
        let categories = [];

        async function loadFilters() {
            try {
                const catRes = await fetch('/api/categories');
                categories = await catRes.json();
                
                renderFilters();
                loadTrending();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function renderFilters() {
            const catContainer = document.getElementById('categoryFilters');
            catContainer.innerHTML = '<button class="filter-btn active" onclick="selectCategory(\'all\')">Todas</button>';
            categories.forEach(function(cat) {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = cat.icon + ' ' + cat.name;
                btn.onclick = function() { selectCategory(cat.name); };
                catContainer.appendChild(btn);
            });
            
            const catSelect = document.getElementById('categorySelect');
            catSelect.innerHTML = '<option value="">Categoría</option>';
            categories.forEach(function(cat) {
                catSelect.innerHTML += '<option value="' + cat.name + '">' + cat.icon + ' ' + cat.name + '</option>';
            });
        }

        function selectCategory(cat) {
            currentCategory = cat;
            
            // Actualizar botones activos
            const buttons = document.querySelectorAll('#categoryFilters .filter-btn');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
                if (cat === 'all' && btn.textContent.trim() === 'Todas') {
                    btn.classList.add('active');
                } else if (btn.textContent.includes(cat)) {
                    btn.classList.add('active');
                }
            });
            
            // Recargar tendencias con la nueva categoría
            loadTrending();
        }

        async function loadTrending() {
            const list = document.getElementById('trendingList');
            list.innerHTML = '<p>Cargando tendencias...</p>';
            
            try {
                const url = '/api/trending?category=' + encodeURIComponent(currentCategory) + '&limit=5';
                const res = await fetch(url);
                const trends = await res.json();
                
                if (trends.length === 0) {
                    list.innerHTML = '<p>No hay tendencias disponibles.</p>';
                    return;
                }
                
                let html = '';
                trends.forEach(function(t, i) {
                    html += '<div class="trending-item" onclick="useTrend(\'' + t.topic.replace(/'/g, "\\'") + '\')">';
                    html += '<div class="trending-topic">' + (i + 1) + '. ' + t.topic + '</div>';
                    html += '<div class="trending-source">📊 ' + t.source + ' | ' + t.region + '</div>';
                    html += '</div>';
                });
                list.innerHTML = html;
            } catch (err) {
                list.innerHTML = '<p>Error cargando tendencias</p>';
            }
        }

        function useTrend(topic) {
            document.getElementById('topicInput').value = topic;
        }

        async function analyzeTrend() {
            const topic = document.getElementById('topicInput').value.trim();
            const category = document.getElementById('categorySelect').value;
            const region = document.getElementById('regionSelect').value;
            
            if (!topic) {
                alert('Ingresa un tema');
                return;
            }

            document.getElementById('analyzeBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic: topic, category: category, region: region })
                });

                const data = await res.json();

                if (data.error) throw new Error(data.error);

                displayResult(data);
                document.getElementById('result').style.display = 'block';
            } catch (err) {
                document.getElementById('error').textContent = 'Error: ' + err.message;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayResult(data) {
            document.getElementById('resultTopic').textContent = data.topic;
            const a = data.analysis;
            
            let html = '';
            
            if (a.hipotesis) {
                html += '<div style="background: #e3f2fd; padding: 15px; border-radius: 8px; border-left: 4px solid #2196f3; margin-bottom: 20px;">';
                html += '<h4 style="margin-top:0; color: #1565c0;">🎯 Hipótesis Editorial</h4>';
                html += '<p style="margin-bottom:0; line-height: 1.6;">' + a.hipotesis + '</p>';
                html += '</div>';
            }
            
            if (a.titulares_ejemplo && a.titulares_ejemplo.length) {
                html += '<h4>📰 Posibles Titulares / Ángulos de Cobertura</h4><ul style="line-height: 1.8;">';
                a.titulares_ejemplo.forEach(function(titular) {
                    html += '<li>📌 ' + titular + '</li>';
                });
                html += '</ul>';
            }
            
            if (a.senales_clave && a.senales_clave.length) {
                html += '<h4>🔍 Señales clave a monitorear</h4><div>';
                a.senales_clave.forEach(function(s) {
                    html += '<span class="tag">' + s + '</span>';
                });
                html += '</div>';
            }
            
            if (a.angulos_periodisticos && a.angulos_periodisticos.length) {
                html += '<h4>📝 Ángulos de investigación</h4><ul>';
                a.angulos_periodisticos.forEach(function(ang) {
                    html += '<li>' + ang + '</li>';
                });
                html += '</ul>';
            }
            
            if (a.fuentes_sugeridas && a.fuentes_sugeridas.length) {
                html += '<h4>📚 Fuentes sugeridas</h4><ul>';
                a.fuentes_sugeridas.forEach(function(f) {
                    html += '<li>🔗 ' + f + '</li>';
                });
                html += '</ul>';
            }
            
            document.getElementById('analysisContent').innerHTML = html;
        }

        loadFilters();
    </script>
</body>
</html>
