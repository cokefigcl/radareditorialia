<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Editorial con IA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1, h2, h3, h4 { color: #333; margin-bottom: 15px; }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin: 4px;
            color: #333;
        }
        .filter-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        .filter-btn:hover { border-color: #007bff; }
        .trending-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 12px;
            color: white;
        }
        .trending-section h3 { color: white; }
        .trending-item {
            padding: 15px;
            margin: 10px 0;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            cursor: pointer;
        }
        .trending-item:hover { background: rgba(255,255,255,0.25); }
        .trending-topic { font-weight: 600; font-size: 16px; }
        .trending-source { font-size: 12px; opacity: 0.8; margin-top: 5px; }
        input[type="text"], select {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }
        input[type="text"] { flex: 1; min-width: 200px; }
        .input-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .mode-selector {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .mode-btn {
            padding: 10px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .mode-btn:hover { border-color: #007bff; }
        .mode-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        .lens-selector {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .lens-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .lens-btn:hover { border-color: #28a745; }
        .lens-btn.active {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }
        button {
            background: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        .tag {
            display: inline-block;
            background: #e9ecef;
            padding: 6px 12px;
            margin: 4px;
            border-radius: 4px;
            font-size: 14px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
        .score-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-right: 10px;
        }
        .score-low { background: #ffebee; color: #c62828; }
        .score-medium { background: #fff8e1; color: #f57f17; }
        .score-high { background: #e8f5e9; color: #2e7d32; }
        .score-critical { background: #b71c1c; color: white; }
        .history-item {
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
        }
        .history-topic { font-weight: 600; font-size: 16px; }
        .history-meta { font-size: 12px; color: #666; margin-top: 5px; }
        .history-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-small {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            color: white;
        }
        .btn-analyze { background: #007bff; }
        .btn-delete { background: #dc3545; }
        .news-section {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 25px;
            border-radius: 12px;
            color: white;
            margin-top: 20px;
        }
        .news-section h4 { color: white; margin: 0 0 15px 0; }
        .news-item {
            padding: 12px;
            margin: 8px 0;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
        }
        .news-title { font-weight: 600; margin-bottom: 5px; }
        .news-title a { color: white; text-decoration: none; }
        .news-title a:hover { text-decoration: underline; }
        .news-meta { font-size: 12px; opacity: 0.9; }
        .no-news {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
            margin: 20px 0;
        }
        .no-news p { margin: 0; color: #856404; }
        .footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #e0e0e0;
            background: white;
            border-radius: 12px;
        }
        .footer a { color: #007bff; text-decoration: none; font-weight: 600; }
        .footer .version { font-size: 12px; color: #999; margin-top: 5px; }
        .mode-label {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 10px;
        }
        .mode-briefing { background: #17a2b8; color: white; }
        .mode-devil { background: #dc3545; color: white; }
        .mode-compare { background: #6f42c1; color: white; }
        .mode-standard { background: #6c757d; color: white; }
        .category-group { margin-bottom: 12px; }
        .category-group-title {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 Radar Editorial con IA</h1>
        <h3>📂 Categorías</h3>
        <div id="categoryFilters"></div>
    </div>
    
    <div class="container">
        <div class="trending-section">
            <h3>🔥 Tendencias en Chile</h3>
            <div id="trendingList"><p>Cargando...</p></div>
        </div>
    </div>
    
    <div class="container">
        <h3>🔍 Análisis Personalizado</h3>
        
        <h4 style="margin-top: 20px;">Modo de Análisis</h4>
        <div class="mode-selector">
            <button class="mode-btn active" onclick="selectMode('standard')">📊 Estándar</button>
            <button class="mode-btn" onclick="selectMode('briefing')">⚡ Briefing</button>
            <button class="mode-btn" onclick="selectMode('devil')">😈 Abogado del Diablo</button>
            <button class="mode-btn" onclick="selectMode('compare')">⚖️ Comparador</button>
        </div>
        
        <div class="input-group">
            <input type="text" id="topicInput" placeholder="Tema principal">
            <input type="text" id="topic2Input" placeholder="Segundo tema (solo comparador)" style="display: none;">
            <select id="categorySelect"><option value="">Categoría</option></select>
            <select id="regionSelect"><option value="Chile">Chile</option></select>
        </div>
        
        <div id="lensSelector" class="lens-selector">
            <button class="lens-btn active" onclick="selectLens('')">🎯 Sin lente</button>
            <button class="lens-btn" onclick="selectLens('data')">🔍 Datos</button>
            <button class="lens-btn" onclick="selectLens('controversy')">🔥 Polémico</button>
            <button class="lens-btn" onclick="selectLens('human')">👥 Humano</button>
            <button class="lens-btn" onclick="selectLens('economic')">💰 Económico</button>
        </div>
        
        <button onclick="analyzeTrend()" id="analyzeBtn">Analizar</button>
        <div class="loading" id="loading"><p>🤖 Analizando...</p></div>
        <div class="error" id="error"></div>
        <div class="warning" id="warning"></div>
        <div class="result" id="result">
            <h3>📊 Análisis: <span id="resultTopic"></span></h3>
            <div id="analysisContent"></div>
        </div>
    </div>
    
    <div class="container">
        <h2> Historial de Análisis</h2>
        <div id="historyList"><p>Cargando...</p></div>
    </div>
    
    <div class="footer">
        <div>Desarrollado por <a href="https://ltv.cl" target="_blank">Joesramirez</a> - <a href="https://ltv.cl" target="_blank">LTV.cl</a></div>
        <div class="version">Versión 5.1.0 | Última actualización: Septiembre 2026</div>
    </div>

    <script>
        let currentCategory = 'all';
        let categories = [];
        let currentMode = 'standard';
        let currentLens = '';

        async function loadFilters() {
            try {
                const catRes = await fetch('/api/categories');
                categories = await catRes.json();
                renderFilters();
                loadTrending();
                loadHistory();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function renderFilters() {
            const catContainer = document.getElementById('categoryFilters');
            
            const temas = categories.filter(c => c.type === 'tema');
            const regiones = categories.filter(c => c.type === 'region');
            const secciones = categories.filter(c => c.type === 'seccion');
            
            let html = '';
            
            html += '<div class="category-group">';
            html += '<div class="category-group-title">📂 TEMAS</div>';
            html += '<button class="filter-btn active" onclick="selectCategory(\'all\')">Todas</button>';
            temas.forEach(function(cat) {
                html += '<button class="filter-btn" onclick="selectCategory(\'' + cat.name + '\')">' + cat.icon + ' ' + cat.name + '</button>';
            });
            html += '</div>';
            
            html += '<div class="category-group">';
            html += '<div class="category-group-title">📍 REGIONES</div>';
            regiones.forEach(function(cat) {
                html += '<button class="filter-btn" onclick="selectCategory(\'' + cat.name + '\')">' + cat.icon + ' ' + cat.name + '</button>';
            });
            html += '</div>';
            
            html += '<div class="category-group">';
            html += '<div class="category-group-title">📰 SECCIONES</div>';
            secciones.forEach(function(cat) {
                html += '<button class="filter-btn" onclick="selectCategory(\'' + cat.name + '\')">' + cat.icon + ' ' + cat.name + '</button>';
            });
            html += '</div>';
            
            catContainer.innerHTML = html;
            
            const catSelect = document.getElementById('categorySelect');
            catSelect.innerHTML = '<option value="">Categoría</option>';
            categories.forEach(function(cat) {
                catSelect.innerHTML += '<option value="' + cat.name + '">' + cat.icon + ' ' + cat.name + '</option>';
            });
        }

        function selectCategory(cat) {
            currentCategory = cat;
            const buttons = document.querySelectorAll('#categoryFilters .filter-btn');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
                if ((cat === 'all' && btn.textContent.trim() === 'Todas') || btn.textContent.includes(cat)) {
                    btn.classList.add('active');
                }
            });
            loadTrending();
        }

        async function loadTrending() {
            const list = document.getElementById('trendingList');
            list.innerHTML = '<p>Cargando...</p>';
            try {
                const url = '/api/trending?category=' + encodeURIComponent(currentCategory) + '&limit=5';
                const res = await fetch(url);
                const trends = await res.json();
                if (trends.length === 0) {
                    list.innerHTML = '<p>No hay tendencias.</p>';
                    return;
                }
                let html = '';
                trends.forEach(function(t, i) {
                    html += '<div class="trending-item" onclick="useTrend(\'' + t.topic.replace(/'/g, "\\'") + '\')">';
                    html += '<div class="trending-topic">' + (i + 1) + '. ' + t.topic + '</div>';
                    html += '<div class="trending-source">📊 ' + t.source + ' | ' + t.region + '</div>';
                    html += '</div>';
                });
                list.innerHTML = html;
            } catch (err) {
                list.innerHTML = '<p>Error cargando tendencias</p>';
            }
        }

        function useTrend(topic) {
            document.getElementById('topicInput').value = topic;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectMode(mode) {
            currentMode = mode;
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach(function(btn) { btn.classList.remove('active'); });
            event.target.classList.add('active');
            
            const topic2Input = document.getElementById('topic2Input');
            const lensSelector = document.getElementById('lensSelector');
            
            if (mode === 'compare') {
                topic2Input.style.display = 'block';
                lensSelector.style.display = 'none';
            } else if (mode === 'briefing' || mode === 'devil') {
                topic2Input.style.display = 'none';
                lensSelector.style.display = 'none';
            } else {
                topic2Input.style.display = 'none';
                lensSelector.style.display = 'flex';
            }
        }

        function selectLens(lens) {
            currentLens = lens;
            const buttons = document.querySelectorAll('.lens-btn');
            buttons.forEach(function(btn) { btn.classList.remove('active'); });
            event.target.classList.add('active');
        }

        async function analyzeTrend() {
            const topic = document.getElementById('topicInput').value.trim();
            const topic2 = document.getElementById('topic2Input').value.trim();
            const category = document.getElementById('categorySelect').value;
            const region = document.getElementById('regionSelect').value;
            
            if (!topic) { alert('Ingresa un tema'); return; }
            if (currentMode === 'compare' && !topic2) { alert('Ingresa el segundo tema para comparar'); return; }

            document.getElementById('analyzeBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('warning').style.display = 'none';

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        topic: topic, 
                        topic2: topic2,
                        category: category, 
                        region: region,
                        mode: currentMode,
                        lens: currentLens
                    })
                });
                const data = await res.json();
                
                if (data.warning) {
                    document.getElementById('warning').textContent = '⚠️ ' + data.warning;
                    document.getElementById('warning').style.display = 'block';
                }
                
                displayResult(data);
                document.getElementById('result').style.display = 'block';
                loadHistory();
            } catch (err) {
                document.getElementById('error').textContent = 'Error: ' + err.message;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        }

        function getScoreClass(score) {
            if (score >= 9) return 'score-critical';
            if (score >= 7) return 'score-high';
            if (score >= 4) return 'score-medium';
            return 'score-low';
        }

        function getScoreLabel(score) {
            if (score >= 9) return '🔴 CRÍTICA';
            if (score >= 7) return '✅ ALTA';
            if (score >= 4) return '⚠️ MEDIA';
            return '🔵 BAJA';
        }

        function displayResult(data) {
            if (!data) {
                document.getElementById('analysisContent').innerHTML = '<p>Error: No se recibieron datos</p>';
                return;
            }
            
            const modeLabels = {
                'standard': 'Estándar',
                'briefing': 'Briefing',
                'devil': 'Abogado del Diablo',
                'compare': 'Comparador'
            };
            
            document.getElementById('resultTopic').innerHTML = data.topic + 
                (data.topic2 ? ' vs ' + data.topic2 : '') +
                '<span class="mode-label mode-' + data.mode + '">' + modeLabels[data.mode] + '</span>';
            
            const a = data.analysis || {};
            const score = data.score || a.puntaje_relevancia || 0;
            let html = '';
            
            if (data.mode === 'briefing') {
                if (a.resumen_ejecutivo) {
                    html += '<div style="background: #d1ecf1; padding: 15px; border-radius: 8px; border-left: 4px solid #17a2b8; margin-bottom: 20px;">';
                    html += '<h4 style="margin-top:0; color: #0c5460;">📝 Resumen Ejecutivo</h4>';
                    html += '<p style="margin-bottom:0; line-height: 1.6;">' + a.resumen_ejecutivo + '</p>';
                    html += '</div>';
                }
                if (a.preguntas_fuente && a.preguntas_fuente.length) {
                    html += '<h4>❓ Preguntas para tu Fuente</h4><ul>';
                    a.preguntas_fuente.forEach(function(q) { html += '<li>' + q + '</li>'; });
                    html += '</ul>';
                }
                if (a.datos_duros && a.datos_duros.length) {
                    html += '<h4> Datos Duros a Verificar</h4><div>';
                    a.datos_duros.forEach(function(d) { html += '<span class="tag">' + d + '</span>'; });
                    html += '</div>';
                }
                if (a.timeline_sugerido) {
                    html += '<h4> Timeline Sugerido</h4><p>' + a.timeline_sugerido + '</p>';
                }
            }
            
            else if (data.mode === 'devil') {
                if (a.cobertura_mainstream) {
                    html += '<div style="background: #f8d7da; padding: 15px; border-radius: 8px; border-left: 4px solid #dc3545; margin-bottom: 20px;">';
                    html += '<h4 style="margin-top:0; color: #721c24;"> Lo que todos dicen</h4>';
                    html += '<p style="margin-bottom:0; line-height: 1.6;">' + a.cobertura_mainstream + '</p>';
                    html += '</div>';
                }
                if (a.angulo_ciego) {
                    html += '<div style="background: #d4edda; padding: 15px; border-radius: 8px; border-left: 4px solid #28a745; margin-bottom: 20px;">';
                    html += '<h4 style="margin-top:0; color: #155724;">💡 Tu ángulo único</h4>';
                    html += '<p style="margin-bottom:0; line-height: 1.6;">' + a.angulo_ciego + '</p>';
                    html += '</div>';
                }
                if (a.riesgos_sesgos && a.riesgos_sesgos.length) {
                    html += '<h4>⚠️ Riesgos y Sesgos</h4><div>';
                    a.riesgos_sesgos.forEach(function(r) { html += '<span class="tag">' + r + '</span>'; });
                    html += '</div>';
                }
                if (a.pregunta_incomoda) {
                    html += '<h4>🔥 La Pregunta Incómoda</h4><p style="font-size: 18px; font-weight: bold; color: #dc3545;">' + a.pregunta_incomoda + '</p>';
                }
            }
            
            else if (data.mode === 'compare') {
                if (a.mas_recorrido) {
                    html += '<div style="background: #e2e3f5; padding: 15px; border-radius: 8px; border-left: 4px solid #6f42c1; margin-bottom: 20px;">';
                    html += '<h4 style="margin-top:0; color: #383d41;">📊 Más Recorrido</h4>';
                    html += '<p style="margin-bottom:0; line-height: 1.6;">' + a.mas_recorrido + '</p>';
                    html += '</div>';
                }
                if (a.fuentes_comunes && a.fuentes_comunes.length) {
                    html += '<h4>🔗 Fuentes Comunes</h4><div>';
                    a.fuentes_comunes.forEach(function(f) { html += '<span class="tag">' + f + '</span>'; });
                    html += '</div>';
                }
                if (a.angulo_conector) {
                    html += '<h4>💡 Ángulo Conector</h4><p>' + a.angulo_conector + '</p>';
                }
                if (a.recomendacion) {
                    html += '<h4>✅ Recomendación</h4><p style="font-weight: bold;">' + a.recomendacion + '</p>';
                }
            }
            
            else {
                if (score > 0) {
                    html += '<div style="margin-bottom: 20px;">';
                    html += '<span class="score-badge ' + getScoreClass(score) + '">' + score + '/10 - ' + getScoreLabel(score) + '</span>';
                    if (a.justificacion_puntaje) {
                        html += '<span style="color: #666; font-size: 14px; margin-left: 10px;">' + a.justificacion_puntaje + '</span>';
                    }
                    html += '</div>';
                }
                
                if (a.hipotesis) {
                    html += '<div style="background: #e3f2fd; padding: 15px; border-radius: 8px; border-left: 4px solid #2196f3; margin: 20px 0;">';
                    html += '<h4 style="margin-top:0; color: #1565c0;">🎯 Hipótesis Editorial</h4>';
                    html += '<p style="margin-bottom:0; line-height: 1.6;">' + a.hipotesis + '</p>';
                    html += '</div>';
                }
                
                if (a.titulares_ejemplo && a.titulares_ejemplo.length) {
                    html += '<h4>📝 Posibles Titulares</h4><ul>';
                    a.titulares_ejemplo.forEach(function(t) { html += '<li>📌 ' + t + '</li>'; });
                    html += '</ul>';
                }
                
                if (a.senales_clave && a.senales_clave.length) {
                    html += '<h4>🔍 Señales clave</h4><div>';
                    a.senales_clave.forEach(function(s) { html += '<span class="tag">' + s + '</span>'; });
                    html += '</div>';
                }
                
                if (a.angulos_periodisticos && a.angulos_periodisticos.length) {
                    html += '<h4>📝 Ángulos de investigación</h4><ul>';
                    a.angulos_periodisticos.forEach(function(ang) { html += '<li>' + ang + '</li>'; });
                    html += '</ul>';
                }
                
                if (a.fuentes_sugeridas && a.fuentes_sugeridas.length) {
                    html += '<h4>📚 Fuentes sugeridas</h4><ul>';
                    a.fuentes_sugeridas.forEach(function(f) { html += '<li>🔗 ' + f + '</li>'; });
                    html += '</ul>';
                }
            }
            
            if (a.noticias_reales && Array.isArray(a.noticias_reales) && a.noticias_reales.length > 0) {
                html += '<div class="news-section">';
                html += '<h4>📰 Noticias Reales Encontradas (' + a.noticias_reales.length + ')</h4>';
                a.noticias_reales.forEach(function(news) {
                    html += '<div class="news-item">';
                    if (news.url) {
                        html += '<div class="news-title"><a href="' + news.url + '" target="_blank"> ' + news.titulo + '</a></div>';
                    } else {
                        html += '<div class="news-title">📰 ' + news.titulo + '</div>';
                    }
                    html += '<div class="news-meta">';
                    if (news.fuente) html += '📡 ' + news.fuente;
                    if (news.fecha) html += ' | 📅 ' + news.fecha;
                    html += '</div></div>';
                });
                html += '</div>';
            }
            
            if (html === '') {
                html = '<p style="color: #666;">No se generó análisis.</p>';
            }
            
            document.getElementById('analysisContent').innerHTML = html;
        }

        async function loadHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '<p>Cargando...</p>';
            try {
                const res = await fetch('/api/history?limit=20');
                const history = await res.json();
                if (history.length === 0) {
                    list.innerHTML = '<p style="color: #666;">Aún no hay análisis.</p>';
                    return;
                }
                let html = '';
                history.forEach(function(item) {
                    const analysis = item.analysis || {};
                    const score = item.score || analysis.puntaje_relevancia || 0;
                    const category = item.category || 'General';
                    const mode = item.mode || 'standard';
                    const date = item.created_at ? new Date(item.created_at).toLocaleString('es-CL') : '';
                    const modeLabels = {'standard': '', 'briefing': '⚡', 'devil': '😈', 'compare': '️'};
                    
                    html += '<div class="history-item">';
                    html += '<div class="history-header">';
                    html += '<div><div class="history-topic">' + modeLabels[mode] + ' ' + item.topic + (item.topic2 ? ' vs ' + item.topic2 : '') + '</div>';
                    html += '<div class="history-meta">📂 ' + category + ' |  ' + date + '</div></div>';
                    if (score > 0 && mode === 'standard') {
                        html += '<span class="score-badge ' + getScoreClass(score) + '">' + score + '/10</span>';
                    }
                    html += '</div>';
                    html += '<div class="history-actions">';
                    html += '<button class="btn-small btn-analyze" onclick="reAnalyze(\'' + item.topic.replace(/'/g, "\\'") + '\', \'' + (item.category || '') + '\', \'' + mode + '\')">🔄 Re-analizar</button>';
                    html += '<button class="btn-small btn-delete" onclick="deleteAnalysis(' + item.id + ')">🗑️ Eliminar</button>';
                    html += '</div></div>';
                });
                list.innerHTML = html;
            } catch (err) {
                console.error('Error:', err);
                list.innerHTML = '<p>Error cargando historial</p>';
            }
        }

        function reAnalyze(topic, category, mode) {
            document.getElementById('topicInput').value = topic;
            if (category) document.getElementById('categorySelect').value = category;
            selectMode(mode);
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(function() { analyzeTrend(); }, 500);
        }

        async function deleteAnalysis(id) {
            if (!confirm('¿Eliminar este análisis?')) return;
            try {
                const res = await fetch('/api/history/' + id, { method: 'DELETE' });
                if (res.ok) loadHistory();
            } catch (err) { alert('Error al eliminar'); }
        }

        loadFilters();
    </script>
</body>
</html>
